<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warp Drive Game</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="gameCanvas"></canvas>



<!-- HUD / Tampilan Game -->

<div id="cockpit">

    <h1>🚀 WARP DRIVE</h1>


    <div class="status">

        <p>Planet Tujuan:</p>

        <h2 id="planetName">
            Belum Dipilih
        </h2>

    </div>


    <div class="status">

        <p>Kecepatan:</p>

        <h2 id="speed">
            0 C
        </h2>

    </div>


    <div class="status">

        <p>Energi Warp:</p>

        <progress 
        id="energy"
        value="100"
        max="100">
        </progress>

    </div>



    <!-- Tombol Planet -->

    <div class="buttons">

        <button onclick="goPlanet('Bumi')">
            🌍 Bumi
        </button>


        <button onclick="goPlanet('Mars')">
            🔴 Mars
        </button>


        <button onclick="goPlanet('Jupiter')">
            🟠 Jupiter
        </button>


        <button onclick="goPlanet('Saturnus')">
            🪐 Saturnus
        </button>


        <button onclick="goPlanet('Neptunus')">
            🔵 Neptunus
        </button>

    </div>



    <!-- Warp -->

    <div class="warpButtons">

        <button onclick="startWarp()">
            ⚡ Aktifkan Warp
        </button>


        <button onclick="stopWarp()">
            🛑 Matikan Warp
        </button>

    </div>


</div>




<!-- Pesan -->

<div id="hud">

    <div id="message">
        🚀 Sistem siap
    </div>

</div>





<!-- Kontrol HP -->

<div id="mobileControl">


    <button id="btnUp">
        ⬆️
    </button>


    <div>

        <button id="btnLeft">
            ⬅️
        </button>


        <button id="btnDown">
            ⬇️
        </button>


        <button id="btnRight">
            ➡️
        </button>

    </div>


</div>






<!-- Semua JavaScript -->

<script src="engine.js"></script>

<script src="player.js"></script>

<script src="stars.js"></script>

<script src="planets.js"></script>

<script src="warp.js"></script>

<script src="audio.js"></script>

<script src="hud.js"></script>

<script src="asteroids.js"></script>

<script src="missions.js"></script>

<script src="upgrades.js"></script>

<script src="menu.js"></script>

<script src="mobile.js"></script>

<script src="enemy.js"></script>

<script src="script.js"></script>


</body>

</html>
